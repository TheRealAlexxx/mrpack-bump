[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mrpack-bump"
version = "0.2.0"
description = "Update every mod in a .mrpack to its latest compatible version, in one command"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TheRealAlexxx"}]
keywords = ["modrinth", "minecraft", "modpack", "mrpack", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
mrpack-bump = "mrpack_bump:main"

[tool.setuptools]
py-modules = ["mrpack_bump"]
